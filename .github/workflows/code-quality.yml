name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint black isort

    - name: Run flake8
      continue-on-error: true
      run: |
        echo "## Flake8 Results" >> $GITHUB_STEP_SUMMARY
        flake8 tests/ utils/ --count --select=E9,F63,F7,F82 --show-source --statistics >> $GITHUB_STEP_SUMMARY || true
        echo "" >> $GITHUB_STEP_SUMMARY

    - name: Check code formatting with black
      continue-on-error: true
      run: |
        echo "## Black Formatting Check" >> $GITHUB_STEP_SUMMARY
        black --check tests/ utils/ --diff >> $GITHUB_STEP_SUMMARY || true
        echo "" >> $GITHUB_STEP_SUMMARY

    - name: Check import sorting with isort
      continue-on-error: true
      run: |
        echo "## Import Sorting Check" >> $GITHUB_STEP_SUMMARY
        isort --check-only tests/ utils/ --diff >> $GITHUB_STEP_SUMMARY || true
        echo "" >> $GITHUB_STEP_SUMMARY

    - name: Run pylint
      continue-on-error: true
      run: |
        echo "## Pylint Results" >> $GITHUB_STEP_SUMMARY
        pylint tests/ utils/ --exit-zero --output-format=text >> $GITHUB_STEP_SUMMARY || true

  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install bandit
      run: pip install bandit[toml]

    - name: Run Bandit security scan
      continue-on-error: true
      run: |
        echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
        bandit -r tests/ utils/ -f json -o bandit-report.json || true
        bandit -r tests/ utils/ || true

    - name: Upload security report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bandit-security-report
        path: bandit-report.json
        retention-days: 30

  dependency-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check for dependency vulnerabilities
      run: |
        pip install safety
        echo "## Dependency Vulnerability Check" >> $GITHUB_STEP_SUMMARY
        safety check --json -r requirements.txt >> $GITHUB_STEP_SUMMARY || true
