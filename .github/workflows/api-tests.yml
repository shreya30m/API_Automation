name: API Automation Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger
    inputs:
      test_group:
        description: 'Test group to run (all, boundary, localization, generate, file_operations, process)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - boundary
          - localization
          - generate
          - file_operations
          - process

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create .env file from secrets
      run: |
        cat << EOF > .env
        BASE_URL=${{ secrets.BASE_URL }}
        USERNAME=${{ secrets.API_USERNAME }}
        PASSWORD=${{ secrets.API_PASSWORD }}
        TENANTID=${{ secrets.TENANTID }}
        USERTYPE=${{ secrets.USERTYPE }}
        CLIENT_AUTH_HEADER=${{ secrets.CLIENT_AUTH_HEADER }}
        LOCALE=${{ secrets.LOCALE }}
        LOCALE_FRENCH=${{ secrets.LOCALE_FRENCH }}
        LOCALE_PORTUGUESE=${{ secrets.LOCALE_PORTUGUESE }}
        SEARCH_LIMIT=${{ secrets.SEARCH_LIMIT }}
        SEARCH_OFFSET=${{ secrets.SEARCH_OFFSET }}
        EOF

    - name: Create output directory
      run: mkdir -p output

    - name: Run tests
      id: pytest
      continue-on-error: true
      run: |
        if [ "${{ github.event.inputs.test_group }}" = "" ] || [ "${{ github.event.inputs.test_group }}" = "all" ]; then
          pytest tests/ -v --html=reports/report.html --self-contained-html --alluredir=allure-results --json-report --json-report-file=.test_report.json
        else
          pytest -m ${{ github.event.inputs.test_group }} -v --html=reports/report.html --self-contained-html --alluredir=allure-results --json-report --json-report-file=.test_report.json
        fi

    - name: Generate dashboard
      if: always()
      run: |
        python generate_dashboard.py

    - name: Upload HTML test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: html-test-report-python-${{ matrix.python-version }}
        path: reports/report.html
        retention-days: 30

    - name: Upload dashboard
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-dashboard-python-${{ matrix.python-version }}
        path: reports/dashboard.html
        retention-days: 30

    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-python-${{ matrix.python-version }}
        path: allure-results/
        retention-days: 30

    - name: Upload test outputs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-outputs-python-${{ matrix.python-version }}
        path: output/
        retention-days: 7

    - name: Generate test summary
      if: always()
      run: |
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Python Version:** ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f reports/report.html ]; then
          echo "✅ Test report generated successfully" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Test report generation failed" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Fail job if tests failed
      if: steps.pytest.outcome == 'failure'
      run: exit 1

  generate-allure-report:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all allure results
      uses: actions/download-artifact@v4
      with:
        pattern: allure-results-*
        path: allure-results-combined
        merge-multiple: true

    - name: Get Allure history
      uses: actions/checkout@v4
      if: github.ref == 'refs/heads/main'
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Generate Allure report
      uses: simple-elf/allure-report-action@v1.7
      with:
        allure_results: allure-results-combined
        allure_history: allure-history
        keep_reports: 20

    - name: Upload Allure report
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-history/
        retention-days: 30

    - name: Deploy Allure report to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history
        keep_files: true

  notify:
    runs-on: ubuntu-latest
    needs: [test, generate-allure-report]
    if: always()

    steps:
    - name: Create status summary
      run: |
        echo "## 🤖 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Workflow:** API Automation Tests" >> $GITHUB_STEP_SUMMARY
        echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Test Status" >> $GITHUB_STEP_SUMMARY
        echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Allure Report: ${{ needs.generate-allure-report.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.test.result }}" = "success" ]; then
          echo "✅ All tests passed!" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Some tests failed. Check the test reports for details." >> $GITHUB_STEP_SUMMARY
        fi
